{# Styles + chart script for includes/finance_summary.html. Put in extra_head / extra_js respectively via the `part` variable. #}
{% if part == 'css' %}
<style>
  .fin-head { margin-bottom: 16px; }
  .fin-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
  .fin-grid { display: grid; grid-template-columns: 3fr 2fr; gap: 20px; margin-bottom: 24px; }
  .fin-grid > *, .fin-stats > * { min-width: 0; }
  .fin-chart-card canvas { max-width: 100%; }
  .fin-legend { display: flex; gap: 16px; font-size: 12px; color: #586b7a; margin: 4px 0 12px; }
  .fin-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .fin-list { margin: 8px 0 0; }
  .fin-list > div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #edf2f5; }
  .fin-list > div:last-child { border-bottom: 0; }
  .fin-list dt { font-size: 13px; color: #586b7a; }
  .fin-list dd { margin: 0; font-family: 'Outfit', sans-serif; font-weight: 700; color: #172033; white-space: nowrap; }
  @media (max-width: 1024px) { .fin-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .fin-grid { grid-template-columns: 1fr; } }
  @media (max-width: 520px) { .fin-stats { grid-template-columns: 1fr; } }
</style>
{% else %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
(function () {
  const el = document.getElementById('finChart');
  const data = JSON.parse(document.getElementById('fin-series').textContent);
  if (!el || typeof Chart === 'undefined') return;
  if (!data.gross.some((v) => v > 0)) {
    el.style.display = 'none';
    el.insertAdjacentHTML('afterend', '<p style="text-align:center;color:#9aaaba;font-size:13px;padding:40px 0;">No paid orders in this period yet.</p>');
    return;
  }
  const peso = (v) => '₱' + Number(v).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  new Chart(el, {
    type: 'line',
    data: {
      labels: data.labels,
      datasets: [
        { label: 'Gross', data: data.gross, borderColor: '#1287d9', backgroundColor: 'rgba(18,135,217,.08)', borderWidth: 2, pointRadius: 0, tension: .35, fill: true },
        { label: 'Net', data: data.net, borderColor: '#18a463', backgroundColor: 'transparent', borderWidth: 2, pointRadius: 0, tension: .35 },
      ],
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` ${c.dataset.label}: ${peso(c.parsed.y)}` } } },
      scales: { y: { beginAtZero: true, ticks: { callback: (v) => peso(v) } }, x: { ticks: { maxTicksLimit: 8 } } },
    },
  });
})();
</script>
{% endif %}
