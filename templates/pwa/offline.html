{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1287d9">
  <title>You're offline — CLEFRESH</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
  <style>
    :root { --primary: #1287d9; --accent: #f9ca47; --text: #0b1f33; --muted: #586b7a; --bg: #f0f8fa; --card: #fff; }
    @media (prefers-color-scheme: dark) { :root { --text: #e7eef4; --muted: #9fb2c1; --bg: #0b1622; --card: #13212f; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
           background: var(--bg); color: var(--text); font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .card { width: min(420px, 100%); background: var(--card); border-radius: 18px; padding: 32px 24px; text-align: center;
            box-shadow: 0 20px 60px rgba(7, 50, 69, .14); }
    img { width: 96px; height: auto; margin-bottom: 12px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 20px; font-size: 15px; }
    .brand { font-weight: 800; letter-spacing: .02em; }
    .brand b { color: var(--primary); }
    button { border: 0; border-radius: 10px; background: var(--accent); color: #4a2e00; font-weight: 800; font-size: 15px;
             padding: 12px 22px; cursor: pointer; min-height: 44px; }
    ul { text-align: left; color: var(--muted); font-size: 14px; line-height: 1.7; padding-left: 20px; margin: 0 0 20px; }
  </style>
</head>
<body>
  <main class="card">
    <img src="{% static 'img/icon-192.png' %}" alt="">
    <p class="brand"><b>CLE</b>FRESH</p>
    <h1>You're offline</h1>
    <p>We can't reach CLEFRESH right now. Your orders and payments are safe — nothing is lost.</p>
    <ul>
      <li>Check your mobile data or Wi-Fi.</li>
      <li>Riders: your location and photo uploads resume once you're back online.</li>
    </ul>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
