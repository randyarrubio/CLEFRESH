{% extends 'base.html' %}
{% block title %}Forgot Password — CLEFRESH{% endblock %}
{% block content %}
<div class="acc-page">
  <div class="acc-card">
    <span class="acc-logo"><span class="brand-cle">CLE</span><span class="brand-fresh">FRESH</span></span>
    <div class="acc-icon" aria-hidden="true"><i class="bi bi-key"></i></div>
    <h1 class="acc-title">Forgot your password?</h1>
    <p class="acc-sub">Enter the email address for your account and we'll send you a link to set a new password.</p>

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="fp-email">Email address</label>
        <div class="lf-input-wrap">
          <i class="bi bi-envelope lf-input-icon" aria-hidden="true"></i>
          <input id="fp-email" type="email" name="email" required placeholder="you@example.com" autocomplete="email" autofocus>
        </div>
      </div>
      <button type="submit" class="lf-submit-btn">Send reset link <i class="bi bi-arrow-right" aria-hidden="true"></i></button>
    </form>

    <p class="acc-foot">Remembered it? <a href="{% url 'login' %}">Back to sign in</a></p>
  </div>
</div>
{% endblock %}
